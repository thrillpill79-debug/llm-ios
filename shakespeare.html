<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinyLLM — Shakespeare</title>
<meta name="description" content="Chat with a from-scratch LLM running locally on your phone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101018">
<style>
  :root {
    --bg: #101018; --panel: #1a1a26; --bubble-user: #7c6cff; --text: #e8e8f0;
    --dim: #8a8aa0; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --accent: #7c6cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f8; --panel: #e7e7ee; --text: #1a1a24; --dim: #6a6a80; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 12px calc(10px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  header {
    padding: 12px 4px 8px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 1.1rem; }
  header span { color: var(--dim); font-size: .72rem; text-align: right; }
  #chat {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 8px; padding: 6px 2px;
  }
  .msg {
    max-width: 85%; padding: 9px 13px; border-radius: 16px;
    font-size: .92rem; line-height: 1.45; white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff;
              border-bottom-right-radius: 5px; }
  .msg.bot  { align-self: flex-start; background: var(--panel);
              font-family: var(--mono); font-size: .85rem;
              border-bottom-left-radius: 5px; }
  .msg.note { align-self: center; background: none; color: var(--dim);
              font-size: .75rem; text-align: center; max-width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; padding-top: 8px; }
  .row label { color: var(--dim); font-size: .72rem; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #tempv { color: var(--dim); font-size: .72rem; min-width: 30px; text-align: right; }
  #box {
    flex: 1; background: var(--panel); color: var(--text); border: none;
    border-radius: 18px; padding: 11px 14px; font-size: 1rem; min-width: 0;
  }
  #box:focus { outline: 2px solid var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 50%;
    width: 42px; height: 42px; font-size: 1.15rem; flex-shrink: 0;
  }
  #send:disabled { opacity: .45; }
  #status { color: var(--dim); font-size: .68rem; text-align: center;
            min-height: .9em; padding-top: 3px; }
</style>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">‹</a> TinyLLM</h1>
    <span id="modelinfo">loading model…</span>
  </header>
  <div id="chat">
    <div class="msg note">This is an 818k-parameter model trained only on
Shakespeare — it answers every message in (garbled) verse, remembers just the
last ~128 characters, and runs entirely on your phone. It is gloriously
dumb and completely yours.</div>
  </div>
  <div class="row">
    <label>Temperature</label>
    <input type="range" id="temp" min="0.1" max="1.5" step="0.05" value="0.8">
    <output id="tempv">0.80</output>
  </div>
  <div class="row">
    <input id="box" type="text" placeholder="Speak, friend…"
           autocapitalize="sentences" autocomplete="off">
    <button id="send" disabled>↑</button>
  </div>
  <div id="status"></div>
  <script type="module" src="shakespeare.js"></script>
</body>
</html>
