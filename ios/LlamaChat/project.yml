# XcodeGen spec for the LlamaChat app.
#   xcodegen generate --spec ios/LlamaChat/project.yml
# Expects llama.xcframework at ios/LlamaChat/vendor/llama.xcframework
# (CI builds it from the pinned llama.cpp source; on a Mac run
# llama.cpp's build-xcframework.sh and copy the result there).
name: LlamaChat
options:
  bundleIdPrefix: dev.llmios
  deploymentTarget:
    iOS: "17.0"
targets:
  LlamaChat:
    type: application
    platform: iOS
    sources:
      - path: LlamaChatApp.swift
      - path: ChatView.swift
      - path: ChatViewModel.swift
      - path: Engine
      - path: ../Shared
      - path: Assets.xcassets
    dependencies:
      - framework: vendor/llama.xcframework
        embed: true
    entitlements:
      path: LlamaChat.entitlements
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LlamaChat
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # declaring no non-exempt encryption keeps TestFlight builds from
        # stalling on an export-compliance question
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID:default=dev.llmios.llamachat)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: $(BUILD_NUMBER:default=1)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
schemes:
  LlamaChat:
    build:
      targets:
        LlamaChat: all
