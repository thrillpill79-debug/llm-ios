# XcodeGen spec for the TinyLLM app.
#   xcodegen generate --spec ios/TinyLLM/project.yml
# CI uses this to build an unsigned IPA; on a Mac it replaces the manual
# "create project and drag files" steps.
name: TinyLLM
options:
  bundleIdPrefix: dev.llmios
  deploymentTarget:
    iOS: "17.0"
targets:
  TinyLLM:
    type: application
    platform: iOS
    sources:
      - path: TinyLLMApp.swift
      - path: ContentView.swift
      - path: Engine
      - path: Assets.xcassets
      - path: ../../model/export
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TinyLLM
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID:default=dev.llmios.tinyllm)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: $(BUILD_NUMBER:default=1)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
schemes:
  TinyLLM:
    build:
      targets:
        TinyLLM: all
