# Deploys the web app to GitHub Pages by pushing the built site to the
# gh-pages branch (the repo's active Pages source). GitHub's own
# "pages build and deployment" publishes it from there.
#
# The site is PocketGPT: real instruct models running in the browser via
# llama.cpp/WASM, plus the from-scratch Shakespeare model on a second page.
name: Deploy web app

on:
  push:
    branches: [claude/custom-llm-iokoa9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JS engine parity test
        run: node web/test/parity.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/test
          mkdir -p _site/model
          cp model/export/config.json model/export/vocab.json \
             model/export/manifest.json model/export/weights.bin _site/model/
          touch _site/.nojekyll
          du -sh _site
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web app from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
